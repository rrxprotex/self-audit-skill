name: Eval Suite

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      case:
        description: 'Eval case to run (case-quick-mode, case-deep-mode, or all)'
        required: false
        default: 'all'
        type: choice
        options: [case-quick-mode, case-deep-mode, all]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install Python dependencies
        run: pip install pyyaml jsonschema --quiet

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        shell: bash

      - name: Add marketplace and install plugin
        run: |
          claude plugin marketplace add rrxprotex/self-audit-skill --scope project
          claude plugin install self-audit@self-audit-marketplace

      - name: Run model-agnostic eval suite
        run: |
          python .github/scripts/eval-runner.py --case "${{ github.event.inputs.case || 'all' }}"
        shell: bash

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
          retention-days: 7

      - name: Check eval threshold
        if: always()
        run: |
          python -c "
          import json, sys
          try:
              with open('eval-results.json') as f:
                  results = json.load(f)
          except:
              print('No eval results file')
              sys.exit(1)
          for case in results.get('cases', []):
              score = case.get('aggregates', {}).get('score', 0)
              threshold = case.get('aggregates', {}).get('threshold', 0.6)
              status = 'PASS' if score >= threshold else 'FAIL'
              print(f'{case[\"name\"]}: {score:.2f} ({status})')
              if score < threshold:
                  sys.exit(1)
          print('All cases passed threshold')
          "
        shell: bash

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('eval-results.json', 'utf8'));
            let body = '## Eval Results\n\n';
            for (const caseResult of results.cases) {
              const status = caseResult.aggregates.score >= caseResult.aggregates.threshold ? '✅' : '❌';
              body += `${status} **${caseResult.name}**: ${caseResult.aggregates.score.toFixed(2)} / ${caseResult.aggregates.threshold}\n`;
            }
            body += '\n*Full results uploaded as artifact.*';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate plugin
        run: claude plugin validate . --strict --json

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update plugin.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" .claude-plugin/plugin.json
          cat .claude-plugin/plugin.json

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --pretty=format:"- %s" $PREV_TAG..HEAD > CHANGELOG_TEMP.md
          else
            git log --oneline --pretty=format:"- %s" > CHANGELOG_TEMP.md
          fi
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## ${{ steps.version.outputs.version }} ($(date +%Y-%m-%d))" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          cat CHANGELOG_TEMP.md >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          cat CHANGELOG.md 2>/dev/null | tail -n +5 >> CHANGELOG_NEW.md 2>/dev/null || true
          mv CHANGELOG_NEW.md CHANGELOG.md 2>/dev/null || true
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Self-Audit Skill v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installable
        run: |
          # Test that the plugin can be installed from the release
          claude plugin install ${{ github.repository }}@${{ github.ref_name }} --scope project --trust-plugin --dry-run 2>&1 || echo "Dry run not supported, skipping"
        shell: bash
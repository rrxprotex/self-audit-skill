name: case-deep-mode
description: Deep mode calibration includes cross-model validation and trend analysis
prompt: 'Run self-audit deep mode with cross-model validation. Include trend analysis
  from prior calibration.log.

  '
schema_version: '1.0'
graders:
- name: cross-model-validation
  type: static
  criteria: 'Verify cross-model validation is honestly reported (checks the runner
    actually enforces):

    - If cross-model-validation.log.jsonl exists and is non-empty: each record has blind_spot_id,
    reviewer, command, verdict, notes, additional_blind_spots, timestamp; verdict parsed
    from real reviewer output; >= 1 reviewer

    - If the log is missing or empty: the calibration report MUST carry the visible
    NOT_RUN marker line (unrun validation must never be silently absent)
    '
- name: trend-analysis
  type: static
  criteria: 'Verify trend analysis produced valid report:

    - .claude/knowledge/calibration-trend-report.md exists with sections: Sessions
    Analyzed, Overall Calibration, By Layer, Persistent Weak Spots, Recommendations

    - calibration-report.md updated with "Cross-Model Validation" and "Calibration
    Trend" sections

    - If ≥3 sessions in log, trend direction (IMPROVING/DEGRADING/STABLE) computed

    - Metrics computed from actual log data (mean |Δ|, overconfidence rate, underconfidence
    rate)'
threshold: 0.8
